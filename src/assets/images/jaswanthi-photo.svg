<svg width="300" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b9d;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff8fab;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c44569;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="personGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8f9fa;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="150" cy="150" r="150" fill="url(#bgGradient)"/>
  
  <!-- Person silhouette -->
  <g transform="translate(150, 150)">
    <!-- Head -->
    <circle cx="0" cy="-40" r="35" fill="url(#personGradient)"/>
    
    <!-- Body -->
    <ellipse cx="0" cy="20" rx="45" ry="60" fill="url(#personGradient)"/>
    
    <!-- Arms -->
    <ellipse cx="-35" cy="0" rx="15" ry="40" fill="url(#personGradient)" transform="rotate(-20)"/>
    <ellipse cx="35" cy="0" rx="15" ry="40" fill="url(#personGradient)" transform="rotate(20)"/>
  </g>
  
  <!-- Text -->
  <text x="150" y="280" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Your Photo Here</text>
  <text x="150" y="300" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-family="Arial, sans-serif" font-size="14">Replace with actual photo</text>
</svg>
